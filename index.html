<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Project</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="CPI.js" defer></script>
    <script src="main.js" defer></script>

    <h1>salaryGraph</h1>
    <h4>No Inflation.</h4>
    <div id="cpi-salary-graph">
        <canvas id="salaryGraph" width="50vw" height="30vh"></canvas>
    </div>

    <h1>inflationResetSalaryGraph</h1>
    <h4>Inflation is reset on each salary entry.</h4>
    <div id="irsg">
        <canvas id="inflation-reset-salary-graph" width="50vw" height="30vh"></canvas>
    </div>

    <h1>noInflationReset</h1>
    <h4>Inflation is not reset. Values are in dollars of the start of your career.</h4>
    <div id="nrsg">
        <canvas id="no-reset-salary-graph" width="50vw" height="30vh"></canvas>
    </div>

    <h1>CPI Over Time</h1>
    <div id="cpi-data">
        <canvas id="cpiGraph" width="50vw" height="30vh"></canvas>
    </div>
</body>
</html>
